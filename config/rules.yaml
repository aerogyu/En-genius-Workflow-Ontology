# 빌드 규칙 값 — 사내에서 코드 수정 없이 조정한다 (기존 Tool 온톨로지 저장소 원칙).
# 전달 방법 짧은 별칭 → 정식 값 (정식 값 = Tool 온톨로지 '전달 방법' 선택지 + 미상)
transfer_aliases:
  수기: 메일·수기 전달
  메일: 메일·수기 전달
  파일: 파일 저장
  PDM: PDM 등록
  DB: DB 기록
  직접: 타 SW 직접 연동
  연동: 타 SW 직접 연동
# 수기 구간으로 보는 전달 방법 (Tool Agent 후보 질의·그림 표시)
manual_transfer_values: [메일·수기 전달]
# 참/거짓으로 읽는 글자 (모든 값을 글자로 읽은 뒤 스키마가 boolean 인 칸에서만 바꾼다)
true_words: [true, "yes", 예, 참, o]
false_words: [false, "no", 아니오, 거짓, x]
# 메시지 수준 덮어쓰기 — 코드: 오류|경고|참고 (예: R05: 참고)
levels: {}
# 인명 유사 패턴 (자유 텍스트 칸 경고 — 기존 저장소 person_patterns_all 과 같은 꼴)
person_patterns:
  - '(책임|선임|수석|연구원|과장|차장|부장|대리|사원|팀장|파트장|그룹장|센터장)\s*님'
  - '[가-힣]{2,4}\s*(책임|선임|수석|과장|차장|부장|대리|팀장|파트장|그룹장)(님|\b|\s|$)'
  - '내선\s*[:：]?\s*\d{3,5}'
