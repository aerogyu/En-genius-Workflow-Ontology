id: http://en-genius.local/onto/wf/
name: engenius_workflow
title: En-Genius 개념설계 워크플로 온톨로지 (최종 시안 v0.1)
version: 0.1.0
description: >-
  개념설계 단계의 워크플로(단계·선후·병렬·반복 루프)와 단계 사이에 주고받는 데이터 계약(Interface)을
  손으로 쓴 YAML 에서 만든다. 이 스키마 하나가 세 가지를 정한다 — ① YAML 파일의 모양 (gen-json-schema →
  빌드 2층 모양 검사) ② RDF 의 술어 IRI (slot_uri → 빌드가 generated/terms.json 으로 읽음) ③ RDF 의 모양
  (gen-shacl → Jena SHACL). '(빌드)' 표시 슬롯은 YAML 에 적지 않고 빌드가 계산해 RDF(derived 그래프)에 넣는다.
  표준 정렬(P-Plan·PROV-O·SKOS)은 schema/alignment.ttl 에 한 방향 공리로만 둔다 (gen-owl 이 남의 어휘를
  덮어쓰지 않게). ID: YAML 에서는 사람이 읽는 key 로 참조하고, RDF IRI 는 레지스트리가 주는 무의미 일련번호.
license: 사내 전용 — 이 PC 에서는 공개 교과서 수준 예시만

prefixes:
  linkml: https://w3id.org/linkml/
  wf: http://en-genius.local/onto/wf/
  egid: http://en-genius.local/id/
  p-plan: http://purl.org/net/p-plan#
  prov: http://www.w3.org/ns/prov#
  skos: http://www.w3.org/2004/02/skos/core#
  dcterms: http://purl.org/dc/terms/
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  owl: http://www.w3.org/2002/07/owl#
  qudt: http://qudt.org/schema/qudt/
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: wf
default_range: string
imports:
  - linkml:types

slots:
  key:
    identifier: true
    slot_uri: skos:notation
    pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
    description: 사람이 읽는 참조 키 (영문 소문자·숫자·하이픈). YAML 안 참조에만 쓰고 RDF IRI 는 레지스트리가 준다.
  label:
    slot_uri: rdfs:label
    required: true
    description: 한국어 이름 (RDF 에서 @ko).
  note:
    slot_uri: skos:note
    description: 메모 (자유 텍스트 — 인명 금지, 빌드가 인명 유사 표기를 경고).
  renamed_from:
    slot_uri: wf:renamedFrom
    multivalued: true
    pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
    description: 예전 key — 적으면 key 를 바꿔도 IRI 가 유지된다 (레지스트리가 옛 key 행을 이어받음).
  version:
    slot_uri: owl:versionInfo
    required: true
    description: 판.
  discipline:
    slot_uri: wf:discipline
    range: Discipline
    description: 분야 (계약이면 소유 분야). 생략하면 파일 머리의 discipline.
  components:
    slot_uri: wf:component
    range: Component
    multivalued: true
    description: 관련 구성품.
  items:
    slot_uri: wf:hasItem
    range: InterfaceItem
    multivalued: true
    inlined_as_list: true
    description: 항목 (JSON 키). 한 줄 축약 '이름 → 단위 | 설명 | 선택' 은 빌드가 이 모양으로 펼친다.
  interface:
    slot_uri: wf:interface
    range: Interface
    required: true
    description: 주고받는 계약.
  tool:
    slot_uri: wf:viaTool
    range: ToolRef
    description: 단계에 툴이 여럿일 때 이 데이터를 다루는 툴.
  format:
    slot_uri: wf:exchangeFormat
    pattern: "^[a-z0-9_+\\-]+(\\.[a-z0-9_+\\-]+)*$"
    description: 이 데이터를 실제로 주고받는 파일 형식 (Tool 온톨로지 정규화 확장자 꼴 — 소문자·점 없이).
  variable:
    slot_uri: wf:variable
    range: DataVariable
    description: (빌드) P-Plan 변수.
  in_plan:
    slot_uri: p-plan:isStepOfPlan
    any_of:
      - range: Workflow
      - range: SubPlan
    description: (빌드) 속한 계획 — 최상위 단계는 워크플로, 하위 단계는 상위 단계의 하위 계획.
  json_schema:
    slot_uri: wf:jsonSchema
    description: (빌드) 생성한 계약 JSON Schema 파일 경로 (<계약 key>/<판>.schema.json).

classes:

  # ======================= YAML 파일 1개의 모양 =======================
  WorkflowFile:
    tree_root: true
    description: YAML 파일 1개의 모양. 모든 파일이 같은 모양이고 절은 전부 선택 (빌드가 파일을 합친다).
    attributes:
      discipline:
        range: Discipline
        description: 이 파일의 기본 분야 (steps·interfaces 에 discipline 이 없으면 이것).
      plan:
        range: Workflow
        inlined: true
        description: 워크플로 머리 — 전체에서 한 번만 (보통 _plan.yaml).
      disciplines:
        range: Discipline
        multivalued: true
        inlined_as_list: true
        description: 분야 목록 (적은 순서 = 그림의 레인 순서).
      components:
        range: Component
        multivalued: true
        inlined_as_list: true
        description: 구성품 목록.
      tools:
        range: ToolRef
        multivalued: true
        inlined_as_list: true
        description: 툴 목록 — Tool 온톨로지와 잇는 칸(tool_id)은 여기 한 곳에만.
      steps:
        range: Step
        multivalued: true
        inlined_as_list: true
        description: 단계.
      interfaces:
        range: Interface
        multivalued: true
        inlined_as_list: true
        description: 데이터 계약 (내놓는 분야의 파일에 둔다).
      loops:
        range: Loop
        multivalued: true
        inlined_as_list: true
        description: 반복 루프 (back_from 단계가 있는 파일에 둔다).

  # ======================= 손으로 쓰는 것 =======================
  Workflow:
    class_uri: wf:Workflow
    description: 워크플로 (예 개념설계). ⊑ p-plan:Plan ⊑ prov:Plan (alignment.ttl).
    slots: [key, label, note, renamed_from, version]
    attributes:
      phase:
        slot_uri: wf:phase
        range: DevPhase
        required: true
        description: 개발 단계.

  Discipline:
    class_uri: wf:Discipline
    description: 분야 (성능·압축기·연소기·터빈·냉각·이차유로) — ⊑ skos:Concept. 조직(파트)이 아니라 기술 분야.
    slots: [key, label, note, renamed_from]
    attributes:
      related_parts:
        slot_uri: wf:relatedPart
        multivalued: true
        description: (선택·사내) 이 분야에 해당하는 Tool 온톨로지 파트 약칭 — 교차 질의를 툴사용(파트×툴) 수준으로 좁힐 때.

  Component:
    class_uri: wf:Component
    description: 구성품 (고압압축기·연소기·고압터빈 …) — ⊑ skos:Concept.
    slots: [key, label, note, renamed_from]
    attributes:
      broader:
        slot_uri: skos:broader
        range: Component
        description: 상위 구성품.

  ToolRef:
    class_uri: wf:ToolRef
    description: >-
      이 워크플로의 툴 이름표. 단계는 key 로 부르고, Tool 온톨로지 TOOL ID 는 여기 한 곳에만 사람이 적는다
      (link-tools 가 후보만 제안 — HITL). 빌드는 --catalog 로 받은 survey.ttl 과 교차 확인만 한다.
    slots: [key, label, note, renamed_from]
    attributes:
      tool_id:
        slot_uri: wf:toolId
        pattern: "^TOOL-[0-9]{6}$"
        description: Tool 온톨로지 TOOL ID (사내 레지스트리 값 — 저장소 예시는 비워 둔다).
      label_at_link:
        slot_uri: wf:labelAtLink
        description: TOOL ID 를 적을 때의 Tool 온톨로지 대표 이름 (스냅샷 — 바뀌면 빌드가 경고).
      not_in_survey:
        slot_uri: wf:notInSurvey
        description: 조사에 없는 툴이면 그 사유 (예 개인 스크립트).
      onto_tool:
        slot_uri: wf:ontoTool
        range: uriorcurie
        description: (빌드) tool_id 를 IRI 로 (egid:TOOL-…).

  Step:
    class_uri: wf:Step
    description: >-
      워크플로 단계 (⊑ p-plan:Step). 하위 단계(part_of 로 가리킴)가 있으면 p-plan:MultiStep 이 되고 하위
      계획으로 펼친다. 선후는 inputs·outputs 에서 빌드가 계산하므로 after 에는 데이터 없이 순서만 있는 선행만 적는다.
    slots: [key, label, discipline, components, note, renamed_from, in_plan]
    attributes:
      status:
        slot_uri: wf:status
        range: WorkStatus
        description: 작성 상태 (판정은 엔지니어).
      part_of:
        slot_uri: wf:partOf
        range: Step
        description: 상위 단계 (작업 묶음).
      after:
        slot_uri: p-plan:isPrecededBy
        range: Step
        multivalued: true
        description: >-
          순서만 있는 선행 단계. 데이터로 이어진 선후는 빌드가 inputs 로 도출해 derived 그래프의 같은 술어에 넣는다
          (루프로 되돌아가는 간선은 넣지 않는다 → 늘 DAG).
      tools:
        slot_uri: wf:usesTool
        range: ToolRef
        multivalued: true
        description: 쓰는 툴 (툴 목록의 key).
      inputs:
        slot_uri: wf:hasInput
        range: InputBinding
        multivalued: true
        inlined_as_list: true
        description: 받는 데이터 — 짧게는 계약 key 만 (빌드가 {interface - key} 로 펼침).
      outputs:
        slot_uri: wf:hasOutput
        range: OutputBinding
        multivalued: true
        inlined_as_list: true
        description: 내놓는 데이터 — 짧게는 계약 key 만.
      when:
        slot_uri: wf:conditionNote
        description: 조건 메모 (조건 분기는 메모로만 — 계산하지 않는다).
      consumes:
        slot_uri: wf:consumes
        range: Interface
        multivalued: true
        description: (빌드) 받는 계약 지름길.
      produces:
        slot_uri: wf:produces
        range: Interface
        multivalued: true
        description: (빌드) 내놓는 계약 지름길.
      input_vars:
        slot_uri: p-plan:hasInputVar
        range: DataVariable
        multivalued: true
        description: (빌드) P-Plan 입력 변수 — 루프로 되돌아오는 입력은 넣지 않는다 (P-Plan 변수 그래프를 DAG 로).
      loop_input_vars:
        slot_uri: wf:loopInputVar
        range: DataVariable
        multivalued: true
        description: (빌드) 루프로 되돌아오는 입력 변수 (이전 반복의 값).
      decomposed_as:
        slot_uri: p-plan:isDecomposedAsPlan
        range: SubPlan
        description: (빌드) 하위 단계가 있으면 그 하위 계획.

  InputBinding:
    class_uri: wf:InputBinding
    description: 단계가 받는 데이터 1건 — 어느 계약을, 어떻게(전달 방법), 어느 툴로.
    slots: [interface, tool, format, note, variable]
    attributes:
      transfer:
        slot_uri: wf:transfer
        range: TransferMethod
        description: 전달 방법 (Tool 온톨로지 '전달 방법' 선택지와 같은 값). '메일·수기 전달' = Tool Agent 후보.
      kind:
        slot_uri: wf:bindingKind
        range: BindingKind
        description: (빌드) 앞 단계 / 루프 / 외부 / 생산자 없음.

  OutputBinding:
    class_uri: wf:OutputBinding
    description: 단계가 내놓는 데이터 1건.
    slots: [interface, tool, format, note, variable]

  Interface:
    class_uri: wf:Interface
    description: >-
      데이터 계약 — 단계 사이에 주고받는 데이터의 항목·단위·형식 (현재 판). 계약마다 JSON Schema(2020-12)를
      생성한다. 확정한 판은 release 명령으로 동결 (InterfaceRelease).
    slots: [key, label, discipline, note, renamed_from, items, json_schema, version]
    slot_usage:
      items:
        required: true
      version:
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
        description: 계약 판 MAJOR.MINOR.PATCH (예 0.1.0). 동결본과 비교해 필요한 올림을 빌드가 계산한다.
    attributes:
      status:
        slot_uri: wf:contractStatus
        range: ContractStatus
        description: 계약 상태 (확정 = 동결본이 있어야 함).
      external:
        slot_uri: wf:external
        range: boolean
        description: 워크플로 밖에서 들어오는 데이터 (만드는 단계가 없는 것이 정상).
      deliverable:
        slot_uri: wf:deliverable
        range: boolean
        description: 워크플로의 최종 산출물 (받는 단계가 없는 것이 정상).
      records:
        slot_uri: wf:hasRecord
        range: Record
        multivalued: true
        inlined_as_list: true
        description: 계약 안에서 되풀이되는 묶음 (예 맵의 속도선 > 점). 항목의 type struct + ref 로 쓴다.

  Record:
    class_uri: wf:Record
    description: 계약 안의 묶음 (표 모양 데이터의 한 줄). 이름은 그 계약 안에서만 유일하면 된다.
    slots: [label, items]
    slot_usage:
      label:
        required: false
      items:
        required: true
    attributes:
      name:
        identifier: true
        slot_uri: wf:recordName
        pattern: "^[A-Z][A-Za-z0-9_]*$"
        description: 묶음 이름 (대문자로 시작, 예 SpeedLine).

  InterfaceItem:
    class_uri: wf:InterfaceItem
    description: 데이터 계약의 항목 1개 = JSON 키 1개.
    slots: [label]
    slot_usage:
      label:
        required: false
    attributes:
      name:
        slot_uri: wf:itemName
        required: true
        pattern: "^[A-Za-z][A-Za-z0-9_]*$"
        description: JSON 키 (영문). 공학 기호 대문자 허용 (W2, Tt4, PR_c).
      type:
        slot_uri: wf:dataType
        range: DataType
        ifabsent: string(number)
        description: 자료형 (생략하면 number).
      unit:
        slot_uri: wf:unitCode
        description: 단위 표기 (config/units.yaml). number·integer 는 필수, 무차원은 1.
      list:
        slot_uri: wf:isList
        range: boolean
        description: 값이 목록 (배열).
      min_items:
        slot_uri: wf:minItems
        range: integer
        minimum_value: 0
        description: 목록의 최소 개수.
      required:
        slot_uri: wf:isRequired
        range: boolean
        ifabsent: "true"
        description: 필수 항목 (생략하면 필수).
      values:
        slot_uri: wf:allowedValue
        multivalued: true
        description: type=enum 일 때 허용 값.
      formats:
        slot_uri: wf:fileFormat
        multivalued: true
        pattern: "^[a-z0-9_+\\-]+(\\.[a-z0-9_+\\-]+)*$"
        description: type=file 일 때 확장자 (Tool 온톨로지 정규화 확장자 꼴 — 소문자, 점 없이, 다중 확장자 cas.h5 허용).
      minimum:
        slot_uri: wf:minimum
        range: float
        description: 최솟값 (선택).
      maximum:
        slot_uri: wf:maximum
        range: float
        description: 최댓값 (선택).
      ref:
        slot_uri: wf:structRef
        any_of:
          - range: Record
          - range: Interface
        description: type=struct 일 때 품는 것 — 같은 계약의 묶음 이름(SpeedLine) 또는 다른 계약 key.
      description:
        slot_uri: skos:definition
        description: 설명.
      unit_iri:
        slot_uri: qudt:hasUnit
        range: uriorcurie
        description: (빌드) QUDT 단위 IRI.
      order:
        slot_uri: wf:order
        range: integer
        description: (빌드) 계약·묶음 안 순서 (1부터).

  Loop:
    class_uri: wf:Loop
    description: >-
      반복 루프 — 되돌아가는 간선(back_from → back_to)을 객체로 만든 것. 몸통 단계는 빌드가 계산
      (back_to 에서 앞으로 가서 back_from 에 닿는 경로 위의 단계 + include). 몸통 밖인데 루프 안에서 바뀌는
      데이터를 받는 단계는 '수렴 뒤 단계'(after_convergence)로 계산해 보여 준다. 수렴 조건·첫 바퀴 값은 메모 (판정은 엔지니어).
    slots: [key, label, note, renamed_from]
    attributes:
      back_from:
        slot_uri: wf:backFrom
        range: Step
        required: true
        description: 루프 끝 — 여기서 되돌아간다.
      back_to:
        slot_uri: wf:backTo
        range: Step
        required: true
        description: 루프 처음 — 여기로 되돌아온다.
      until:
        slot_uri: wf:convergenceNote
        required: true
        description: 수렴 조건 메모.
      initial:
        slot_uri: wf:initialValueNote
        description: 첫 바퀴에 되돌아오는 데이터 대신 쓰는 값의 출처 메모 (예 '설계점 값, 차이 0 가정').
      max_iterations:
        slot_uri: wf:maxIterations
        range: integer
        minimum_value: 1
        description: 최대 반복 메모.
      include:
        slot_uri: wf:includeStep
        range: Step
        multivalued: true
        description: 경로 밖이지만 매 반복 다시 도는 곁가지 단계 (몸통에 더함).
      monitor:
        slot_uri: wf:monitorItem
        multivalued: true
        pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*\\.[A-Za-z][A-Za-z0-9_]*$"
        description: 수렴을 지켜보는 항목 '계약key.항목' (빌드가 있는지 검사).
      members:
        slot_uri: wf:loopMember
        range: Step
        multivalued: true
        description: (빌드) 루프 몸통 단계.
      carries:
        slot_uri: wf:carries
        range: Interface
        multivalued: true
        description: (빌드) 되돌아가는 간선이 나르는 계약.
      after_convergence:
        slot_uri: wf:afterConvergence
        range: Step
        multivalued: true
        description: (빌드) 루프 하류 — 루프 안에서 바뀌는 데이터를 받지만 몸통 밖이라 수렴 뒤에 도는 단계.

  # ======================= 빌드가 만드는 것 =======================
  SubPlan:
    class_uri: wf:SubPlan
    description: (빌드) 하위 단계가 있는 단계를 펼친 하위 계획 (p-plan:isDecomposedAsPlan 의 대상).
    slots: [key, label]

  DataVariable:
    class_uri: wf:DataVariable
    description: (빌드) 워크플로 안의 데이터 1건 = (워크플로, 계약). ⊑ p-plan:Variable.
    slots: [label]
    attributes:
      conforms_to:
        slot_uri: dcterms:conformsTo
        range: Interface
        required: true
        description: 이 변수가 따르는 데이터 계약.
      variable_of_plan:
        slot_uri: p-plan:isVariableOfPlan
        range: Workflow
        required: true
        description: 속한 워크플로.
      output_of:
        slot_uri: p-plan:isOutputVarOf
        range: Step
        multivalued: true
        description: 실제로 만드는 단계 (하위 단계가 있으면 가장 깊은 단계 하나 — 상위 단계 선언은 경계 표시).

  InterfaceRelease:
    class_uri: wf:InterfaceRelease
    description: >-
      (빌드) 계약의 동결 판 기록 — release 명령이 남긴 일자·사유 (HITL 승인 기록, 인명 없음). 옛 판 항목은
      동결 파일과 옛 판 JSON Schema 로 본다.
    slots: [label, json_schema, version]
    attributes:
      of_interface:
        slot_uri: dcterms:isVersionOf
        range: Interface
        required: true
        description: 어느 계약의 판인가.
      released_at:
        slot_uri: wf:releasedAt
        range: date
        required: true
        description: 동결 일자.
      reason:
        slot_uri: wf:releaseReason
        required: true
        description: 동결 사유 (인명 금지).

enums:
  DevPhase:
    description: 개발 단계.
    permissible_values: {개념설계: {}, 기본설계: {}, 상세설계: {}}
  WorkStatus:
    description: 단계 작성 상태.
    permissible_values: {초안: {}, 검토중: {}, 확정: {}}
  ContractStatus:
    description: 계약 상태.
    permissible_values: {초안: {}, 검토중: {}, 확정: {}, 대체됨: {}}
  DataType:
    description: 항목 자료형 (JSON Schema 형으로 옮겨진다).
    permissible_values:
      number: {description: 실수 — 단위 필수}
      integer: {description: "정수 — 단위 필수 (개수는 1)"}
      string: {description: 문자열}
      boolean: {description: 참/거짓}
      enum: {description: values 중 하나}
      file: {description: 파일 참조 (경로 문자열) — formats 로 확장자}
      struct: {description: 묶음(Record) 또는 다른 계약을 품음 — ref}
  TransferMethod:
    description: 전달 방법 — Tool 온톨로지 '전달 방법' 선택지와 같은 값 + 미상 (짧은 별칭은 config/rules.yaml).
    permissible_values: {파일 저장: {}, PDM 등록: {}, DB 기록: {}, 메일·수기 전달: {}, 타 SW 직접 연동: {}, 미상: {}}
  BindingKind:
    description: (빌드) 입력의 출처 종류.
    permissible_values: {앞 단계: {}, 루프: {}, 외부: {}, 생산자 없음: {}}
